  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // S1: Frame 0 is readable immediately. The only motion is the stalled-looking load bar.
    tl.fromTo("#hook-bar-fill", 
      { scaleX: 0 }, 
      { scaleX: 1, duration: 1.8, ease: "none" }, 0.2);

    tl.to("#hook-content", 
      { opacity: 0, filter: "blur(8px)", duration: 0.167, ease: "power3.in" }, 2.0);

    // S2: Three rapid single-line beats, per-word blur-in, previous beat blurs out first.
    const addBeat = (id, start, exit) => {
      tl.set("#" + id, { opacity: 1 }, start);
      tl.fromTo("#" + id + " .w", 
        { opacity: 0, filter: "blur(6px)", y: 15 },
        { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.133, stagger: 0.067, ease: "power2.out" }, 
        start);
      if (exit) {
        tl.to("#" + id, 
          { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in" }, 
          exit);
      }
    };

    addBeat("beat-1", 2.15, 3.0);
    addBeat("beat-2", 3.15, 4.0);
    addBeat("beat-3", 4.15, null);

    window.__timelines["hook"] = tl;
