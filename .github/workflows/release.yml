name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  ci-gate:
    name: Verify CI Gate (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" pytest || pip install -e ".[smt,storage,gpu]" pytest || pip install -e . pytest

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests -v -rs -rx --strict-markers

  release:
    name: Build & Release Package to GitHub & PyPI
    needs: [ci-gate]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/superghidra
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify Tag Matches Package Version
        run: |
          VERSION=$(python -c "import tomllib; f = open('pyproject.toml', 'rb'); print(tomllib.load(f)['project']['version'])")
          EXPECTED_TAG="v${VERSION}"
          if [ "${{ github.ref_name }}" != "$EXPECTED_TAG" ]; then
            echo "Error: Git tag '${{ github.ref_name }}' does not match pyproject.toml version '$EXPECTED_TAG'"
            exit 1
          fi
          INIT_VERSION=$(python -c "import sys; sys.path.insert(0, 'src'); import superghidra; print(superghidra.__version__)")
          if [ "$INIT_VERSION" != "$VERSION" ]; then
            echo "Error: superghidra.__version__ '$INIT_VERSION' does not match pyproject.toml version '$VERSION'"
            exit 1
          fi
          echo "Verified tag '${{ github.ref_name }}' matches package version '$VERSION'"

      - name: Install Build Tooling
        run: |
          python -m pip install --upgrade pip build wheel

      - name: Build Python Distribution (sdist & wheel)
        run: |
          python -m build

      - name: Package Ghidra GUI Sync Extension Zip
        run: |
          mkdir -p build/extension
          cp -r ghidra_extension_skeleton/* build/extension/
          cp src/superghidra/integrations/ghidra_gui_overlay_sync.py build/extension/
          cd build && zip -r ../SuperGhidra-GUI-Sync-Extension.zip extension/ && cd .. && rm -rf build/extension

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            SuperGhidra-GUI-Sync-Extension.zip
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Publish Distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
