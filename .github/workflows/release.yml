name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  ci-gate:
    name: Verify CI Gate (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" pytest || pip install -e ".[smt,storage,gpu]" pytest || pip install -e . pytest

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests -v -rs -rx --strict-markers

  release:
    name: Build & Release Package to GitHub & PyPI
    needs: [ci-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Build Tooling
        run: |
          python -m pip install --upgrade pip build wheel

      - name: Build Python Distribution (sdist & wheel)
        run: |
          python -m build

      - name: Package Ghidra GUI Sync Extension Zip
        run: |
          mkdir -p dist/extension
          cp -r ghidra_extension_skeleton/* dist/extension/
          cp src/superghidra/integrations/ghidra_gui_overlay_sync.py dist/extension/
          cd dist && zip -r SuperGhidra-GUI-Sync-Extension.zip extension/ && rm -rf extension

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SuperGhidra-GUI-Sync-Extension.zip
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Publish Distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
