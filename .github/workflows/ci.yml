name: CI

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  dco-check:
    name: Verify DCO Sign-off (CLA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by Trailer
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git log --no-merges --format="%H" origin/${{ github.base_ref }}..HEAD)
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && [ -n "${{ github.event.before }}" ]; then
            COMMITS=$(git log --no-merges --format="%H" ${{ github.event.before }}..${{ github.event.after }})
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            COMMITS=$(git log --no-merges -n 1 --format="%H")
          else
            COMMITS=$(git log --no-merges -n 5 --format="%H")
          fi
          for commit in $COMMITS; do
            msg=$(git log -1 --format="%B" $commit)
            if ! echo "$msg" | grep -q "Signed-off-by:"; then
              echo "Error: Commit $commit is missing a 'Signed-off-by:' trailer (git commit -s) per CLA.md"
              exit 1
            fi
          done

  lint-and-typecheck:
    name: Lint & Typecheck (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting & Typing Tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff mypy

      - name: Run Ruff Lint Checks
        run: |
          ruff check src tests

      - name: Run Mypy Type Checks
        run: |
          mypy

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" pytest || pip install -e ".[smt,storage,gpu]" pytest || pip install -e . pytest

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests -v -rs -rx --strict-markers

  test-wheel:
    name: Test Built Wheel in Clean Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build Wheel
        run: |
          python -m pip install --upgrade pip build wheel setuptools
          python -m build --wheel

      - name: Install Wheel in Isolated Location
        run: |
          WHEEL=$(ls dist/*.whl)
          mkdir -p /tmp/clean_env
          cd /tmp/clean_env
          python -m venv test_venv
          . test_venv/bin/activate
          pip install --upgrade pip
          pip install $GITHUB_WORKSPACE/$WHEEL

      - name: Verify Clean Imports and CLI Commands Outside Repository
        run: |
          cd /tmp/clean_env
          . test_venv/bin/activate
          python -c "import superghidra; print('Version:', superghidra.__version__)"
          python -c "import superghidra; missing = [k for k in superghidra._SUPPORTED_CORE if not hasattr(superghidra, k)]; assert not missing, f'Missing: {missing}'"
          python -c "import superghidra; assert len(superghidra.__all__) == 33"
          superghidra version
          superghidra rtti-recover $GITHUB_WORKSPACE/tests/fixtures/binaries/sample_x64.dll -o /tmp/clean_env/recovered.json
          python -c "import json; data = json.load(open('/tmp/clean_env/recovered.json')); assert 'rtti_classes' in data"
          superghidra decompile $GITHUB_WORKSPACE/tests/fixtures/binaries/sample_x64.dll --rva 0x1020 --standalone -o /tmp/clean_env/decomp.c
          python -c "code = open('/tmp/clean_env/decomp.c').read(); assert 'rax' in code"
