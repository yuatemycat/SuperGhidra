[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "superghidra"
version = "0.4.0"
description = "SuperGhidra: Autonomous Agent Reverse Engineering, Lock-Free Ghidra Daemon & C++ Recovery Suite"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "yuatemycat" },
]
keywords = [
    "ghidra",
    "reverse-engineering",
    "decompiler",
    "gpu-acceleration",
    "vulkan",
    "directx12",
    "z3",
    "smt",
    "pcode",
    "arm64",
    "x86-64",
    "disassembler",
    "binary-analysis",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Disassemblers",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.urls]
Homepage = "https://github.com/yuatemycat/SuperGhidra"
Repository = "https://github.com/yuatemycat/SuperGhidra"
Documentation = "https://github.com/yuatemycat/SuperGhidra/tree/master/docs"
"Issue Tracker" = "https://github.com/yuatemycat/SuperGhidra/issues"

[project.optional-dependencies]
smt = ["z3-solver"]
gpu = ["wgpu"]
storage = ["lz4", "zstandard"]
frida = ["frida"]
ghidra = ["pyghidra"]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.4",
]
all = [
    "z3-solver",
    "wgpu",
    "lz4",
    "zstandard",
    "frida",
    "pyghidra",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["superghidra*"]

[tool.setuptools.package-data]
superghidra = ["py.typed", "schemas/*.json"]

[project.scripts]
superghidra = "superghidra.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
norecursedirs = ["scratch", ".*", "build", "dist", "*.egg", "templates", "docs", "ghidra_extension_skeleton", "scripts", "tests_manual"]
markers = [
    "integration: marks integration tests that run against real binaries",
]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
follow_imports = "silent"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
files = [
    "src/superghidra/__init__.py",
    "src/superghidra/__main__.py",
    "src/superghidra/formats/binary_loader.py",
    "src/superghidra/formats/msvc_class_recovery.py",
    "src/superghidra/formats/synthetic_symbol_exporter.py",
    "src/superghidra/formats/macho_objc_recovery.py",
    "src/superghidra/formats/ida_flirt_bridge.py",
    "src/superghidra/core/compilable_filter.py",
    "src/superghidra/core/ghidra_oracle.py",
    "src/superghidra/core/live_binary_tools.py",
    "src/superghidra/core/cluster_daemon.py",
    "src/superghidra/schemas/validator.py",
    "src/superghidra/lifters",
    "src/superghidra/acceleration",
    "src/superghidra/storage",
    "src/superghidra/compat",
    "src/superghidra/diff/binary_diff_engine.py",
    "src/superghidra/diff/evidence_ledger.py",
    "src/superghidra/diff/semantic_delta_log.py",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter / legacy long strings)
    "E402",  # module level import not at top of file
    "E701",  # multiple statements on one line (colon)
    "E702",  # multiple statements on one line (semicolon)
    "E741",  # ambiguous variable name
    "E731",  # do not assign a lambda expression, use a def
    "F403",  # star imports in shims
    "F405",  # star import names
    "F841",  # local variable assigned but never used
    "UP006", # non-pep585 type annotations in legacy code
    "UP035", # legacy typing imports
]

[tool.ruff.lint.isort]
known-first-party = ["superghidra"]
